<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>UW58 color measurement viewer</title>
<script src="renderColor.js"></script>
<script src="uw58_targets.data.js"></script>
<script src="calib_monitor1.data.js"></script>
<script src="calib_monitor2.data.js"></script>
<style>
    html, body {
        margin: 0;
        height: 100%;
        color: #fff;
        font-family: monospace;
        overflow: hidden;
    }
    /* body background is set from calib.background_rgb once CALIB loads --
       this is the same background color the triplet task uses. */
    /* 150x150 matches colorSquare() in index.html -- same size, color, and
       background as the triplet task, not just the same color. */
    #square {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 150px;
        height: 150px;
        transform: translate(-50%, -50%);
    }
    #panel {
        position: fixed;
        top: 0;
        left: 0;
        max-width: 320px;
        box-sizing: border-box;
        padding: 12px 16px;
        background: rgba(0, 0, 0, 0.72);
        font-size: 13px;
        line-height: 1.5;
    }
    #panel h1 {
        font-size: 14px;
        margin: 0 0 8px 0;
    }
    #panel .row { margin-bottom: 10px; }
    #panel .label { color: #aaa; }
    #panel .value { font-weight: bold; }
    #panel button {
        font-family: monospace;
        font-size: 13px;
        padding: 6px 10px;
        margin-right: 6px;
        margin-top: 4px;
        cursor: pointer;
    }
    #warning {
        margin-top: 12px;
        padding: 8px;
        background: #b45309;
        color: #fff;
        font-size: 12px;
        display: none;
    }
</style>
</head>
<body>
<div id="square"></div>
<div id="panel">
    <h1>UW58 color measurement viewer</h1>
    <div class="row"><span class="label">monitor:</span> <span class="value" id="f-monitor"></span></div>
    <div class="row"><span class="label">identity (n/58):</span> <span class="value" id="f-index"></span></div>
    <div class="row"><span class="label">identity hex:</span> <span class="value" id="f-identity"></span></div>
    <div class="row"><span class="label">adjusted target xyY:</span><br><span class="value" id="f-target"></span></div>
    <div class="row"><span class="label">renderColor() rgb:</span> <span class="value" id="f-rgb"></span></div>
    <div class="row">
        <button id="btn-prev">&larr; prev</button>
        <button id="btn-next">next &rarr;</button>
    </div>
    <div class="row" style="color:#aaa;">arrow keys also work. this is exactly renderColor() -- the same function the triplet task uses, on the same background color -- so what you measure here is what the study will show.</div>
    <div id="warning"></div>
</div>
<script>
    "use strict";

    var monitorNum = null;
    while (monitorNum !== 1 && monitorNum !== 2) {
        var entry = window.prompt("Monitor number (1 or 2):", "");
        if (entry === null) {
            document.body.innerHTML = "<p style='padding:20px;'>Cancelled. Reload to start.</p>";
            throw new Error("Monitor number not provided.");
        }
        monitorNum = parseInt(entry, 10);
        if (monitorNum !== 1 && monitorNum !== 2) {
            window.alert("Please enter either 1 or 2.");
        }
    }

    // Loaded via plain <script src> tags above (uw58_targets.data.js,
    // calib_monitor{1,2}.data.js) rather than fetch()/XHR, so this page
    // works when opened directly (file://) with no local server needed.
    var TARGETS = UW58_TARGETS;
    var CALIB = (monitorNum === 2) ? CALIB_MONITOR_2 : CALIB_MONITOR_1;

    // Same background the triplet task shows behind its squares -- read
    // from the manifest, not recomputed (see COLOR_REFACTOR_BRIEF.md §4.4).
    document.body.style.backgroundColor = "rgb(" + CALIB.background_rgb.join(",") + ")";

    // Deterministic order. Note: plain Object.keys(TARGETS) is NOT safe to
    // rely on here -- per the JS spec, an all-digit hex key with no leading
    // zero (e.g. "777777", "184415", "608218", "897618") is treated as an
    // array index and silently reordered to the front ahead of the other
    // 54 string keys, regardless of insertion order. Sorting explicitly
    // sidesteps that.
    var identities = Object.keys(TARGETS).sort();

    var warningEl = document.getElementById("warning");
    warningEl.style.display = "block";
    warningEl.textContent = "This viewer always renders straight from calib_monitor" +
        monitorNum + ".json's current adjustments. measured_xyY (once filled in) has no " +
        "effect on the rendered color -- it only feeds self_test.js's pass/fail check in " +
        "the real experiment.";

    var idx = 0;
    var squareEl = document.getElementById("square");
    var fMonitor = document.getElementById("f-monitor");
    var fIndex = document.getElementById("f-index");
    var fIdentity = document.getElementById("f-identity");
    var fTarget = document.getElementById("f-target");
    var fRgb = document.getElementById("f-rgb");

    fMonitor.textContent = monitorNum + " (" + (CALIB.label || "") + ")";

    function render() {
        var identity = identities[idx];
        var target = TARGETS[identity];
        var rgb = renderColor(target, CALIB, identity);
        var css = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";

        squareEl.style.backgroundColor = css;
        fIndex.textContent = (idx + 1) + " / " + identities.length;
        fIdentity.textContent = identity;

        var adj = (CALIB.adjustments && CALIB.adjustments[identity]) || { dx: 0, dy: 0, dY: 0 };
        var off = CALIB.global_offset || { x: 0, y: 0, Y: 0 };
        var x = target.x + adj.dx + off.x;
        var y = target.y + adj.dy + off.y;
        var Y = target.Y + adj.dY + off.Y;
        fTarget.textContent = "x=" + x.toFixed(4) + "  y=" + y.toFixed(4) + "  Y=" + Y.toFixed(2);

        fRgb.textContent = css + "  (#" + rgb.map(function (v) {
            return ("0" + v.toString(16).toUpperCase()).slice(-2);
        }).join("") + ")";
    }

    function next() { idx = (idx + 1) % identities.length; render(); }
    function prev() { idx = (idx - 1 + identities.length) % identities.length; render(); }

    document.getElementById("btn-next").addEventListener("click", next);
    document.getElementById("btn-prev").addEventListener("click", prev);
    document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight") next();
        if (e.key === "ArrowLeft") prev();
    });

    render();
</script>
</body>
</html>
